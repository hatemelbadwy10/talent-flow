name: Flutter quality

on:
  pull_request:
  push:
    branches:
      - main
      - solve-chat-issue
      - codex/production-safe-refactor

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Analyzer (no errors)
        # The live baseline contains warning/info debt documented under
        # docs/refactor. Migrated files are checked warning-free locally.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
