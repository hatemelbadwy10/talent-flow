name: Flutter quality

on:
  pull_request:
  push:
    branches:
      - main
      - solve-chat-issue
      - codex/production-safe-refactor

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Analyzer baseline
        run: ./tool/check_analyzer_baseline.sh
